name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-plugins:
    name: validate-plugins
    uses: bitcart/bitcart-actions/.github/workflows/validate-plugins.yml@master

  workflows:
    name: workflows
    uses: bitcart/bitcart-actions/.github/workflows/workflow-checks.yml@master

    permissions:
      contents: read
      security-events: write # needed for github advanced security
